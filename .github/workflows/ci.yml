name: CI

on:
  pull_request: {}
  push:
    branches:
      - "main"
  schedule:
    - cron: '20 17 * * *'

jobs:
  generate-env:
    name: generate-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate prod environment
        run: node scripts/generate-env.mjs
        env:
          API_URL: ${{ secrets.API_URL }}
          COGNITO_AUTHORITY: ${{ secrets.COGNITO_AUTHORITY }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
      - name: Upload env artifact
        uses: actions/upload-artifact@v4
        with:
          name: env
          path: src/environments/environment*.ts

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,html,css,json}"

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [generate-env]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: env
          path: src/environments/
      - run: npx ng test --watch=false

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [generate-env]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: env
          path: src/environments/
      - run: npm run build

  semgrep:
    name: sast
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/javascript --config p/typescript src/