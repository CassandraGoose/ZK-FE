name: CI

on:
  pull_request: {}
  push:
    branches: ["main"]
  schedule:
    - cron: '20 17 * * *'

jobs:
  quality:
    name: lint / format / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,html,css,json}"
      - run: npm run build
      - run: npx ng test --watch=false

  semgrep:
    name: semgrep/angular
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/javascript --config p/typescript src/